# Joint-space waypoints in degrees, order:
# [shoulder_pan, shoulder_lift, elbow, wrist_1, wrist_2, wrist_3]
#
# The poses are safe in URSim. On a real arm, check them against the
# workspace (table, fixtures, cables) before running, and start with a
# low MAX_JOINT_SPEED and the pendant speed slider turned down.
max_joint_speed: 0.5      # rad/s, overridden by MAX_JOINT_SPEED
pause_between_loops: 2.0  # s

waypoints:
  - name: home
    joints_deg: [0, -90, 90, -90, -90, 0]
  - name: left
    joints_deg: [45, -100, 100, -90, -90, 0]
  - name: left_low
    joints_deg: [45, -80, 110, -120, -90, 0]
  - name: right
    joints_deg: [-45, -100, 100, -90, -90, 45]
  - name: right_low
    joints_deg: [-45, -80, 110, -120, -90, 45]
  - name: home
    joints_deg: [0, -90, 90, -90, -90, 0]
